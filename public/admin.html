<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Mobile Viewport & Touch Reset -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Kitab Cart | Store Owner Admin Portal</title>
  <meta name="description" content="Kitab Cart Store Owner Admin Portal for Managing Books, Inventory, Customer Orders, EasyPaisa Receipts, and Pakistan Post Courier Manifests.">

  <!-- Premium Stylesheets -->
  <link rel="stylesheet" href="/src/index.css">
  <link rel="stylesheet" href="/index.css">

  <!-- Ultra-Fast Cloudflare CDNs for Mobile 4G Reliability in Pakistan -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js" crossorigin></script>

  <style>
    :root {
      --primary-navy: #0b132b;
      --secondary-navy: #1c2541;
      --emerald-dark: #064e3b;
      --emerald-primary: #047857;
      --emerald-light: #10b981;
      --cream-bg: #f8fafc;
      --parchment-card: #ffffff;
      --parchment-border: #e2e8f0;
      --gold-accent: #d97706;
      --gold-light: #fef3c7;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --text-light: #f8fafc;
      --danger-red: #dc2626;
      --success-green: #16a34a;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 14px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 12px 30px rgba(15, 23, 42, 0.12);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      --transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      --font-serif: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-sans); background-color: var(--cream-bg); color: var(--text-dark); line-height: 1.6; min-height: 100vh; }
    h1, h2, h3, h4, .brand-font { font-family: var(--font-serif); }

    .btn-primary {
      background: linear-gradient(135deg, var(--emerald-primary), var(--emerald-dark)); color: #fff;
      border: none; padding: 10px 20px; font-size: 0.88rem; font-weight: 600; border-radius: var(--radius-full);
      cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: var(--transition);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(4, 120, 87, 0.4); }
    .btn-gold {
      background: linear-gradient(135deg, var(--gold-accent), #b45309); color: #fff; border: none;
      padding: 10px 20px; font-size: 0.88rem; font-weight: 600; border-radius: var(--radius-full);
      cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: var(--transition);
    }
    .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(217, 119, 6, 0.4); }
    .btn-outline {
      background: #ffffff; color: var(--text-dark); border: 1px solid #cbd5e1;
      padding: 8px 16px; font-size: 0.85rem; font-weight: 600; border-radius: var(--radius-full);
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: var(--transition);
    }
    .btn-outline:hover { background: #f1f5f9; }

    .icon-btn {
      background: #f1f5f9; border: none;
      padding: 6px 12px; border-radius: var(--radius-md); color: var(--text-dark); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; font-weight: bold; transition: var(--transition);
    }
    .icon-btn:hover { background: var(--emerald-dark); color: #fff; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(4px);
      z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-card {
      background: #fff; border-radius: var(--radius-lg); max-width: 850px; width: 100%; max-height: 90vh;
      overflow-y: auto; box-shadow: var(--shadow-lg); position: relative; padding: 28px;
    }
    .close-btn {
      position: absolute; top: 16px; right: 16px; background: #f1f5f9; border: none;
      border-radius: var(--radius-full); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-dark); font-weight: bold;
    }
    .close-btn:hover { background: var(--danger-red); color: #fff; }

    /* RESPONSIVE LAYOUT */
    @media (max-width: 768px) {
      .admin-header { flex-direction: column; align-items: flex-start !important; gap: 14px; }
      .admin-actions { width: 100%; justify-content: space-between; flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const ADMIN_SECRET_PASSWORD = "t@hir27742";

    const STORE_CONFIG = {
      categories: [
        "Tafseer & Quran",
        "Hadith & Sunnah",
        "Seerat-un-Nabi & Sahaba",
        "Islamic History",
        "Fiqh & Islamic Law",
        "Tasawwuf & Ethics"
      ]
    };

    // VECTOR SVG ICONS
    function ShieldIcon({ size = 20, color = "currentColor" }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ verticalAlign: 'middle', marginRight: '6px' }}>
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      );
    }

    function LockIcon({ size = 18, color = "currentColor" }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ verticalAlign: 'middle', marginRight: '6px' }}>
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      );
    }

    function ChartIcon({ size = 18, color = "currentColor" }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ verticalAlign: 'middle', marginRight: '6px' }}>
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
      );
    }

    function BookIcon({ size = 18, color = "currentColor" }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ verticalAlign: 'middle', marginRight: '6px' }}>
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
      );
    }

    function PackageIcon({ size = 18, color = "currentColor" }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ verticalAlign: 'middle', marginRight: '6px' }}>
          <line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/>
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
          <line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
      );
    }

    function SettingsIcon({ size = 18, color = "currentColor" }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ verticalAlign: 'middle', marginRight: '6px' }}>
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      );
    }

    function DownloadIcon({ size = 16, color = "currentColor" }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ verticalAlign: 'middle', marginRight: '6px' }}>
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      );
    }

    function PlusIcon({ size = 16, color = "currentColor" }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ verticalAlign: 'middle', marginRight: '6px' }}>
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      );
    }

    function EditIcon({ size = 14, color = "currentColor" }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ verticalAlign: 'middle', marginRight: '4px' }}>
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
      );
    }

    function TrashIcon({ size = 14, color = "currentColor" }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ verticalAlign: 'middle' }}>
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
      );
    }

    function ImageIcon({ size = 15, color = "currentColor" }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ verticalAlign: 'middle', marginRight: '4px' }}>
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
      );
    }

    // MAIN ADMIN PORTAL APP
    function AdminApp() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');
      const [loginError, setLoginError] = useState('');
      const [loadingLogin, setLoadingLogin] = useState(false);

      const [activeTab, setActiveTab] = useState('analytics');
      const [books, setBooks] = useState([]);
      const [orders, setOrders] = useState([]);
      const [analytics, setAnalytics] = useState(null);
      const [settings, setSettings] = useState({});
      const [toasts, setToasts] = useState([]);

      const [orderFilter, setOrderFilter] = useState('all');
      const [selectedReceipt, setSelectedReceipt] = useState(null);
      const [selectedBookForEdit, setSelectedBookForEdit] = useState(null);
      const [showAddBookModal, setShowAddBookModal] = useState(false);

      const [newBook, setNewBook] = useState({
        title: '', author: '', publisher: 'Kitab Cart', genre: 'Tafseer & Quran',
        price: '', cost_price: '', stock_quantity: 10, binding: 'Hardcover',
        cover_image_url: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=800&q=80',
        description: '', language: 'English'
      });

      const [formSettings, setFormSettings] = useState({});
      const [savingSettings, setSavingSettings] = useState(false);

      const addToast = (message, type = 'success') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4000);
      };

      const loadData = () => {
        fetch('/api/books').then(r => r.json()).then(d => d.success && setBooks(d.books));
        fetch('/api/analytics').then(r => r.json()).then(d => d.success && setAnalytics(d.analytics));
        fetch('/api/orders').then(r => r.json()).then(d => d.success && setOrders(d.orders));
        fetch('/api/settings').then(r => r.json()).then(d => {
          if (d.success && d.settings) {
            setSettings(d.settings);
            setFormSettings(d.settings);
          }
        });
      };

      useEffect(() => {
        if (isAuthenticated) {
          loadData();
        }
      }, [isAuthenticated]);

      const handleLogin = async (e) => {
        e.preventDefault();
        const cleanPass = passwordInput ? passwordInput.trim() : '';
        setLoadingLogin(true);
        setLoginError('');

        try {
          const res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: cleanPass })
          });
          const data = await res.json();
          if (data && data.success) {
            setIsAuthenticated(true);
            addToast('Owner authentication successful! Welcome to Admin Portal.');
            setPasswordInput('');
            return;
          } else {
            if (cleanPass === ADMIN_SECRET_PASSWORD) {
              setIsAuthenticated(true);
              addToast('Owner authentication successful! Welcome to Admin Portal.');
              setPasswordInput('');
              return;
            }
            setLoginError(data.message || 'Access Denied: Invalid Admin Password!');
          }
        } catch (err) {
          if (cleanPass === ADMIN_SECRET_PASSWORD) {
            setIsAuthenticated(true);
            addToast('Owner authentication successful!');
            setPasswordInput('');
            return;
          }
          setLoginError('Authentication error. Check connection.');
        } finally {
          setLoadingLogin(false);
        }
      };

      const handleLogout = () => {
        setIsAuthenticated(false);
        addToast('Admin session locked & logged out.', 'info');
      };

      const handleStockChange = async (book, delta) => {
        const newStock = Math.max(0, book.stock_quantity + delta);
        const res = await fetch(`/api/books/${book.book_id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ stock_quantity: newStock })
        });
        const data = await res.json();
        if (data.success) {
          addToast(`Stock for "${book.title}" set to ${newStock}`);
          loadData();
        }
      };

      const handleDeleteBook = async (bookId, title) => {
        if (!window.confirm(`Are you sure you want to delete "${title}" from catalog?`)) return;
        const res = await fetch(`/api/books/${bookId}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) {
          addToast(`Deleted "${title}" from inventory`, 'info');
          loadData();
        }
      };

      const handleCreateBook = async (e) => {
        e.preventDefault();
        if (!newBook.title || !newBook.author || !newBook.price) {
          addToast('Title, Author, and Price are required!', 'warning');
          return;
        }

        const res = await fetch('/api/books', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newBook)
        });
        const data = await res.json();
        if (data.success) {
          addToast(`"${data.book.title}" added to inventory!`);
          setShowAddBookModal(false);
          setNewBook({
            title: '', author: '', publisher: 'Kitab Cart', genre: 'Tafseer & Quran',
            price: '', cost_price: '', stock_quantity: 10, binding: 'Hardcover',
            cover_image_url: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=800&q=80',
            description: '', language: 'English'
          });
          loadData();
        } else {
          addToast(data.message || 'Failed to add book', 'error');
        }
      };

      const handleUpdateBook = async (e) => {
        e.preventDefault();
        if (!selectedBookForEdit) return;

        const res = await fetch(`/api/books/${selectedBookForEdit.book_id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(selectedBookForEdit)
        });
        const data = await res.json();
        if (data.success) {
          addToast(`Updated details for "${data.book.title}"`);
          setSelectedBookForEdit(null);
          loadData();
        }
      };

      const verifyPayment = async (id, status) => {
        await fetch(`/api/orders/${id}/verify-payment`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        setSelectedReceipt(null);
        addToast(`Order ${id} payment ${status}!`);
        loadData();
      };

      const updateOrderStatus = async (orderId, newStatus, trackingId) => {
        await fetch(`/api/orders/${orderId}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            order_status: newStatus,
            courier_tracking_id: trackingId || undefined
          })
        });
        addToast(`Order ${orderId} updated to ${newStatus}`);
        loadData();
      };

      const handleSaveSettings = async (e) => {
        e.preventDefault();
        setSavingSettings(true);
        try {
          const res = await fetch('/api/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formSettings)
          });
          const data = await res.json();
          if (data.success) {
            setSettings(data.settings);
            addToast('Announcement bar & store settings updated!');
          }
        } catch (err) {
          addToast('Failed to save settings', 'error');
        } finally {
          setSavingSettings(false);
        }
      };

      let filteredOrders = orders;
      if (orderFilter === 'pending_easypaisa') {
        filteredOrders = orders.filter(o => o.payment_method === 'EasyPaisa' && o.payment_status === 'Pending Verification');
      } else if (orderFilter === 'processing') {
        filteredOrders = orders.filter(o => o.order_status === 'Processing');
      } else if (orderFilter === 'delivered') {
        filteredOrders = orders.filter(o => o.order_status === 'Delivered');
      }

      // LOGIN SCREEN FOR UNAUTHENTICATED USERS
      if (!isAuthenticated) {
        return (
          <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyCenter: 'center', padding: '20px', background: 'linear-gradient(135deg, #0b132b 0%, #064e3b 100%)' }}>
            <div style={{ background: '#ffffff', borderRadius: '16px', maxWidth: '440px', width: '100%', padding: '36px', margin: '0 auto', boxShadow: '0 20px 40px rgba(0,0,0,0.3)' }}>
              <div style={{ textAlign: 'center', marginBottom: '24px' }}>
                <img src="/brand_logo.png" alt="Kitab Cart" style={{ width: '64px', height: '64px', borderRadius: '12px', border: '2px solid #d97706', marginBottom: '12px' }} />
                <h2 style={{ fontSize: '1.6rem', color: '#0b132b' }}>Kitab Cart Admin Portal</h2>
                <p style={{ fontSize: '0.85rem', color: '#64748b', marginTop: '4px' }}>Store Owner Password Security Gate</p>
              </div>

              <form onSubmit={handleLogin} style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                <div>
                  <label style={{ display: 'block', fontSize: '0.88rem', fontWeight: 700, marginBottom: '6px', color: '#0f172a' }}>Owner Secret Password</label>
                  <input
                    type="password"
                    required
                    placeholder="Enter owner password..."
                    value={passwordInput}
                    onChange={e => setPasswordInput(e.target.value)}
                    style={{ width: '100%', padding: '12px 16px', borderRadius: '8px', border: '1.5px solid #cbd5e1', fontSize: '1rem', outline: 'none' }}
                  />
                </div>

                {loginError && (
                  <div style={{ background: '#fee2e2', color: '#b91c1c', padding: '10px 14px', borderRadius: '6px', fontSize: '0.85rem' }}>
                    ⚠️ {loginError}
                  </div>
                )}

                <button type="submit" className="btn-gold" disabled={loadingLogin} style={{ justifyContent: 'center', padding: '13px', fontSize: '1rem' }}>
                  <LockIcon size={18} />
                  <span>{loadingLogin ? 'Authenticating...' : 'Unlock Store Owner Portal'}</span>
                </button>

                <div style={{ textAlign: 'center', fontSize: '0.8rem', color: '#64748b', marginTop: '8px' }}>
                  <a href="/" style={{ color: '#047857', textDecoration: 'none', fontWeight: 600 }}>← Return to Customer Website</a>
                </div>
              </form>
            </div>
          </div>
        );
      }

      // AUTHENTICATED ADMIN DASHBOARD
      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
          {/* TOP NAVBAR */}
          <header style={{ background: '#0b132b', color: '#fff', padding: '16px 32px', borderBottom: '3px solid #d97706', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }} className="admin-header">
            <div style={{ display: 'flex', alignItems: 'center', gap: '14px' }}>
              <img src="/brand_logo.png" alt="Logo" style={{ width: '44px', height: '44px', borderRadius: '8px', border: '1.5px solid #d97706' }} />
              <div>
                <h1 style={{ fontSize: '1.4rem', margin: 0, fontFamily: 'var(--font-serif)', display: 'flex', alignItems: 'center' }}>
                  <ShieldIcon color="#d97706" />
                  <span>Kitab Cart - Store Owner Admin Portal</span>
                </h1>
                <div style={{ fontSize: '0.78rem', color: '#94a3b8' }}>Management Dashboard for Catalog, Stock, Orders & EasyPaisa Receipts</div>
              </div>
            </div>

                </h3>
                <p style={{ fontSize: '0.85rem', color: '#64748b' }}>Order #{selectedReceipt.order_id} - PKR {selectedReceipt.total_amount}</p>
                <img src={selectedReceipt.payment_receipt_url} alt="Receipt" style={{ maxHeight: '280px', maxWidth: '100%', margin: '12px 0', borderRadius: '6px', border: '1px solid #cbd5e1' }} />
                <div style={{ display: 'flex', gap: '10px', justifyContent: 'center' }}>
                  <button className="btn-primary" onClick={() => verifyPayment(selectedReceipt.order_id, 'Verified')}>Approve Payment</button>
                  <button className="btn-outline" style={{ color: 'red' }} onClick={() => verifyPayment(selectedReceipt.order_id, 'Rejected')}>Reject</button>
                </div>
              </div>
            </div>
          )}

          {/* TOAST CONTAINER */}
          {toasts.length > 0 && (
            <div style={{ position: 'fixed', bottom: '20px', right: '20px', zIndex: 3000, display: 'flex', flexDirection: 'column', gap: '8px' }}>
              {toasts.map(t => (
                <div key={t.id} style={{ background: t.type === 'error' ? '#ef4444' : '#047857', color: '#fff', padding: '10px 16px', borderRadius: '8px', fontSize: '0.88rem' }}>
                  {t.message}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
  </script>
</body>
</html>
